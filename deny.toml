# cargo-deny 0.19+ configuration.
# Run `cargo deny check` locally; CI runs deny per matrix {advisories, bans, licenses, sources}.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[output]
feature-depth = 1

# --- Security advisories (RustSec DB; subsumes cargo-audit) ---
[advisories]
version = 2
yanked = "warn"

# --- License policy (AGPL-3.0 project; only permissive deps allowed) ---
[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "AGPL-3.0-only",                  # the workspace crates themselves
]
confidence-threshold = 0.8
# Keep a standard permissive allowlist for forward-compat even if not every entry is
# currently in the tree; don't warn on the unused (yet-allowed) ones.
unused-allowed-license = "allow"

# --- Crate bans (dependency discipline) ---
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[[bans.deny]]
crate = "serde_yaml"
reason = "archived upstream (Oct 2024); use serde_yaml_ng"

[[bans.deny]]
crate = "serde_yml"
reason = "RUSTSEC-2025-0068 (CVE fork of archived serde_yaml); use serde_yaml_ng"

[[bans.deny]]
crate = "openssl-sys"
reason = "weaft has no TLS needs; avoid native link dependencies"

# --- Source policy ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [ "https://github.com/rust-lang/crates.io-index" ]
allow-git = [  ]
