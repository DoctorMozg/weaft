#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SUMMARY"
title = "Summary"
kind = "informative"
status = "active"
since = "0.1.0"

[content]
text = """
weaft v2 specifies a capability-aware transpiler that compiles one source project into host-specific configuration for multiple AI coding agents.

**Scope:** This RFC governs the v2 compilation model — the set of artifact kinds weaft recognizes, the (host × kind × field) capability matrix that drives emission, the compilation pipeline, template exposure, serialization and frontmatter fidelity, budget honesty, the v2 source-project layout, and the host registry. It governs externally observable behavior and the user-facing project contract; it does not prescribe internal code structure.

**Hosts in scope:** `claude-code`, `cursor`, `agents-md`, `opencode`, `codex`, `gemini-cli`. **Kinds in scope:** instruction, skill, subagent, command, mcp_server, settings, plugin, hook, ignore.

**Rationale:** v1 compiled only skills and subagents and hardcoded per-host layout and frontmatter in backend code, leaving the capability matrix decorative and making each new host a multi-site edit. v2 makes host and kind differences *data*, so a single source yields meaningfully different, host-valid output per target. The governing design decisions are recorded in the accompanying decision records ADR-0001 through ADR-0006, which reference this RFC. Items still open, and the `gemini-cli` research gap, are recorded in [[RFC-0001:C-OPEN-QUESTIONS]]."""
