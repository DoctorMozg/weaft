#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0006"
title = "Serialization stack and format framing"
status = "accepted"
date = "2026-05-30"
refs = [ "RFC-0001" ]

[content]
context = """
v2 must emit YAML frontmatter, TOML, JSON, plain Markdown, and Markdown-with-frontmatter variants. v1 serializes only YAML, via `serde_yaml`, which is currently lightly maintained (as of 2026-05).

### Problem Statement
Which serialization libraries should v2 depend on, where should those dependencies live, and where should per-format framing (how serialized fields combine with a rendered body) live?

### Constraints
[[RFC-0001:C-SERIALIZATION]] requires multiple formats selectable per (host, kind) and requires the serialization stage to own framing. [[RFC-0001:C-DETERMINISM]] requires stable key ordering. An early redesign phase must preserve v1 output byte-for-byte, which constrains changing the YAML serializer immediately. Serialization is part of emission, which resides in the targets layer; the core layer carries no emission code, so any new serializer dependency belongs with emission rather than in core.

### Options Considered
Keep `serde_yaml` and add TOML and JSON; replace `serde_yaml` immediately; or use one generic value model without per-format framing."""
decision = """
We will **keep the current YAML library for now, add TOML and JSON serializers, give the serialization stage ownership of per-format framing, and isolate serialization behind a single boundary**.

1. **Minimal delta:** Add TOML and JSON support in the targets layer; do not change the YAML serializer during the output-preserving phase. This satisfies [[RFC-0001:C-SERIALIZATION]].
2. **Framing with format:** Each format owns how serialized fields and the rendered body combine (a fenced YAML block, a TOML field carrying the body, a JSON document, a Markdown section).
3. **Swap-friendly:** All serialization sits behind one boundary so the YAML library can be replaced later without touching callers.

### Implementation Notes
Key ordering must be explicit and data-derived so output stays deterministic per [[RFC-0001:C-DETERMINISM]]."""
consequences = """
### Positive
- Smallest possible dependency and behavior change to reach multi-format output.
- Format framing is correct per format, satisfying the fidelity contract.
- A future YAML-library replacement is a contained, single-boundary change.

### Negative
- A lightly-maintained YAML dependency remains in the tree for now (mitigation: the isolation boundary plus a tracked follow-up to revisit).

### Neutral
- New dependencies (TOML and JSON serializers) are added only to the targets layer, keeping the core layer lean."""

[[content.alternatives]]
text = "Keep the current YAML library for now, add TOML and JSON, and isolate all serialization behind one boundary"
status = "accepted"
pros = [
  "Smallest dependency delta; no risk to the output-preserving early phase",
  "Per-format framing is co-located with each format",
  "A later YAML-library swap is contained behind the isolation boundary",
]
cons = [ "A lightly-maintained YAML dependency remains for now" ]

[[content.alternatives]]
text = "Replace the YAML library immediately with a more actively maintained one"
status = "rejected"
cons = [ "Adds churn and output-equivalence risk during the v1-preserving phase" ]
rejection_reason = "Premature; can be done later behind the isolation boundary without touching callers"

[[content.alternatives]]
text = "Use one generic value model serialized to all formats with no per-format framing"
status = "rejected"
cons = [ "Cannot express TOML body-as-field versus YAML fenced body" ]
rejection_reason = "Breaks the framing fidelity required by the serialization contract"
