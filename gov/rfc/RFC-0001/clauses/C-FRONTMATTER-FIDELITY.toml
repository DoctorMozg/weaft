#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-FRONTMATTER-FIDELITY"
title = "Frontmatter key and casing fidelity"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
Emitted field keys and their casing MUST match each host's documented representation exactly, as declared in the matrix field mapping.

A canonical source field MUST be renamed, recased, dropped, or folded according to the (host, kind) field mapping; weaft MUST NOT emit a canonical field name that the host does not use.

**Rationale:** Output must be valid for the target host. Hosts deliberately differ in key spelling and casing — for example a hyphenated tool-allowlist key versus a camelCase always-apply key — and emitting the wrong key produces files the host silently ignores."""
