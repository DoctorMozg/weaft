#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0002"
title = "Field-mapping escape-hatch tiers"
status = "accepted"
date = "2026-05-30"
refs = [
  "RFC-0001",
  "ADR-0001",
]

[content]
context = """
Most host differences are field rename, recase, drop, or fold, but a minority are structural value surgery (for example MCP tool namespacing, or encoding environment variables as nested tables).

### Problem Statement
How much of the per-(host, kind) field transformation should be declarative data, and where should code be allowed when data cannot express a transform?

### Constraints
[[RFC-0001:C-CAPABILITY-MATRIX]] requires the field mapping to be declared as matrix data. [[RFC-0001:C-FRONTMATTER-FIDELITY]] requires emitted keys and casing to match each host exactly. Transforms must run inside the map stage of [[ADR-0001]] and stay pure.

### Options Considered
A three-tier model (data + two code hooks); pure declarative; pure per-host code; or a single combined code hook."""
decision = """
We will **use a data-first field-map with two narrowly-scoped code escape hatches**: a per-(host, kind) field-transform hook for structural value surgery, and a per-host post-emit hook for cross-artifact concerns.

1. **Data default:** Rename, recase, drop, and fold are declared as matrix data and require no code, satisfying [[RFC-0001:C-CAPABILITY-MATRIX]] and [[RFC-0001:C-FRONTMATTER-FIDELITY]].
2. **Justification gate:** A code hook is permitted only when a field-map provably cannot express the transform.
3. **Decorator, not rewrite:** A field-transform hook receives the resolved cell so it can reuse the generic mapping and override only the field that needs surgery.
4. **Two seams, two scopes:** A field-transform runs per (host, kind) inside the map stage, while a post-emit hook runs per host across already-emitted files; the two scopes are distinct, so each is served by its own seam.

### Implementation Notes
Transform hooks run inside the map stage of [[ADR-0001]] and must remain pure (no I/O), so they stay unit-testable."""
consequences = """
### Positive
- The matrix stays introspectable; most hosts need zero transformation code.
- Rare structural encodings remain expressible without bloating the data model.

### Negative
- Risk of escape-hatch sprawl (mitigation: the justification gate, plus review that counts transforms per host and challenges each one).

### Neutral
- Capability facts still live only in the matrix; hooks shape values, not capabilities."""

[[content.alternatives]]
text = "Three tiers: declarative field-map data, a per-(host,kind) field-transform hook, a per-host post-emit hook"
status = "accepted"
pros = [
  "Roughly 90% of cases are pure data",
  "Code is used only where data provably cannot express a transform",
  "Transform hooks are pure, testable, and can reuse the generic mapping path",
]
cons = [ "Two code seams must be governed against sprawl" ]

[[content.alternatives]]
text = "Pure declarative: every transform expressed as data, no per-host code"
status = "rejected"
cons = [ "Requires an ever-growing mini-DSL to express nested or structural encodings" ]
rejection_reason = "An over-complex configuration DSL for a handful of rare cases"

[[content.alternatives]]
text = "Pure per-host code implementing transformation against a shared trait"
status = "rejected"
cons = [ "Reproduces v1 hardcoding; loses matrix introspection; scales poorly across many hosts" ]
rejection_reason = "Defeats the data-driven goal of the redesign"

[[content.alternatives]]
text = "A single code hook covering both per-field value surgery and cross-artifact, whole-file concerns"
status = "rejected"
cons = [
  "The two operate at different scopes and stages: per-field within mapping versus per-file after emission",
]
rejection_reason = "A single hook would force cross-artifact state into the per-field mapping stage, which structurally cannot see other artifacts"
