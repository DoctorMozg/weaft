#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SOURCE-LAYOUT"
title = "v2 source project layout"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A v2 source project MUST organize artifacts by kind, with an artifact's location determining its kind. An artifact MAY override its kind through a field in its own frontmatter.

Project-wide singleton configuration — including permissions/settings, MCP servers, ignore patterns, and plugin identity — MUST be declarable in the project manifest.

The manifest MUST declare the project's supported hosts.

**Rationale:** Organizing by kind mirrors how each host lays out its own configuration and keeps authored source readable, while configuration that is not naturally one-file-per-artifact belongs in the manifest. Locating the kind override in the artifact's own frontmatter keeps an artifact self-describing. Because authors depend on this structure, it is a normative contract."""
