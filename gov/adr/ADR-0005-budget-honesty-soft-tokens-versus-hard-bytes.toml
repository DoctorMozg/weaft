#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0005"
title = "Budget honesty: soft tokens versus hard bytes"
status = "accepted"
date = "2026-05-30"
refs = [
  "RFC-0001",
  "ADR-0001",
]

[content]
context = """
weaft's token budgets are its own heuristics, but some hosts impose real size limits — for example OpenAI Codex's documented AGENTS.md cap of roughly 32 KiB, which silently truncates excess content.

### Problem Statement
How should weaft model budgets so that its advisory heuristics and hosts' real limits are never conflated, and so that a real silently-truncating cap fails the build loudly?

### Constraints
[[RFC-0001:C-BUDGET-HONESTY]] requires distinguishing soft budgets from hard limits, labeling token counts as approximate, and checking byte limits against the final emitted file. The byte check therefore runs in the merge stage of [[ADR-0001]].

### Options Considered
A two-axis budget model; keeping all budgets as soft token heuristics; or treating all budgets as hard limits."""
decision = """
We will **model budgets on two axes — unit (tokens or bytes) and severity (soft or hard)** — and enforce them accordingly.

1. **Soft is advisory:** A soft budget warns, and fails the build only in strict mode.
2. **Hard always errors:** A hard limit fails the build regardless of strict mode, with a message that names the host and states that the host truncates silently. This satisfies [[RFC-0001:C-BUDGET-HONESTY]].
3. **Approximate counts:** Token-based counts are labeled approximate wherever surfaced; hard byte limits are checked against the final emitted file.

### Implementation Notes
The byte-limit check runs in the merge stage of [[ADR-0001]] because folding many artifacts into one file is what exceeds a single-file cap, and only post-merge is the final size known."""
consequences = """
### Positive
- The honesty invariant is preserved as data, not prose.
- Silent-truncation footguns become loud, build-failing errors.

### Negative
- Each host budget must be classified correctly as soft or hard (mitigation: default to soft unless a host documents a real cap, and record the source).

### Neutral
- The existing token-approximation disclaimer remains and is now attached to the soft-token unit."""

[[content.alternatives]]
text = "Two-axis budgets: unit (tokens or bytes) and severity (soft or hard)"
status = "accepted"
pros = [
  "Soft heuristics and real host limits are explicitly distinguished",
  "Hard byte limits are checked on the final merged file, where truncation actually occurs",
  "Honest by construction; token counts stay labeled approximate",
]
cons = [ "The budget lint gains an extra axis to reason about" ]

[[content.alternatives]]
text = "Keep all budgets as soft token heuristics"
status = "rejected"
cons = [ "A real, silently-truncating host cap would pass without error" ]
rejection_reason = "Dishonest about a real footgun that corrupts output"

[[content.alternatives]]
text = "Treat all budgets as hard limits"
status = "rejected"
cons = [ "weaft's heuristics are not host limits; valid builds would be blocked" ]
rejection_reason = "Misrepresents weaft heuristics as host-enforced limits"
