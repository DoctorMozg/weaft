#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-OPEN-QUESTIONS"
title = "Open questions and research gaps"
kind = "informative"
status = "active"
since = "0.1.0"

[content]
text = """
The following are unresolved at ratification and SHOULD be closed before the affected behavior leaves the spec phase.

**Research gap — `gemini-cli`:** The `gemini-cli` host has not been researched to the depth of the other hosts. Until it is verified, every `gemini-cli` capability MUST default to the most conservative disposition (unsupported, unbounded, or drop) so weaft never over-claims support.

**Per-kind field validity:** Field-level validity for the mcp_server, plugin, and hook kinds is specified at shape level only. Validation begins permissive — warning on unknown fields and erroring only on representability — and tightens as each host is verified.

**Migration:** Whether v1-to-v2 source migration is provided as tooling or as documented manual steps is deferred; v2 is a pre-1.0 breaking change.

**Compatibility aliases:** Whether legacy flat capability names are aliased for one release is deferred.

**Currency:** Each host capability value MUST carry a validation date, and a host MUST be re-validated before any of its capabilities is treated as stable."""
