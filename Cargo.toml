[workspace]
resolver = "2"
members = ["crates/weaft-core", "crates/weaft-targets", "crates/weaft-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doctormozg/weaft"

[workspace.dependencies]
weaft-core = { path = "crates/weaft-core" }
weaft-targets = { path = "crates/weaft-targets" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
minijinja = { version = "2", features = ["loader", "macros", "loop_controls"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tiktoken-rs = "0.7"
walkdir = "2"
pulldown-cmark = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
once_cell = "1"

# dev
insta = "1"
assert_cmd = "2"
predicates = "3"
