#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-BUDGET-HONESTY"
title = "Soft budgets versus hard limits"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
weaft MUST distinguish soft budgets from hard limits.

A soft budget is a weaft heuristic; weaft MUST treat it as advisory and MUST escalate it to a build failure only in strict mode, an opt-in build flag that turns soft-budget violations into errors.

A hard limit is a documented host limit; weaft MUST report a violation of a hard limit as an error regardless of strict mode.

Token-based counts MUST be labeled as approximate wherever they are surfaced. A hard limit expressed in bytes MUST be checked against the final emitted file.

**Rationale:** Conflating weaft's own heuristics with real host limits would misrepresent both. Some hosts impose real, silently-truncating size caps that must fail loudly, whereas weaft's token budgets are approximations and must say so."""
