#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-DETERMINISM"
title = "Deterministic output"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
For identical input, weaft MUST produce byte-identical output across runs.

Field order within serialized output, and emitted file paths, MUST be stable and derived from declared data rather than from non-deterministic iteration.

Emitted output MUST NOT embed wall-clock timestamps or absolute filesystem paths; path separators MUST be normalized; and line endings MUST be normalized, so output depends only on the project input and the capability matrix.

**Rationale:** Deterministic output is required for snapshot testing, reproducible builds, and reviewable diffs — the mechanism by which weaft demonstrates that one source yields stable, meaningfully different output per host. Excluding timestamps and absolute paths, and normalizing separators and line endings, keeps that determinism portable across machines and checkouts."""
