#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0004"
title = "v2 source project layout"
status = "accepted"
date = "2026-05-30"
refs = [ "RFC-0001" ]

[content]
context = """
v2 expands from two artifact kinds to nine, so the source-project authoring model must accommodate instructions, skills, subagents, commands, MCP servers, settings, plugins, hooks, and ignore patterns.

### Problem Statement
How should authors lay out a v2 source project so that an artifact's kind is unambiguous, prose-bearing artifacts keep an editable body, and configuration that is not naturally one-file-per-artifact has a home?

### Constraints
[[RFC-0001:C-SOURCE-LAYOUT]] requires kind-organized source, manifest-declared singletons, and manifest-declared supported hosts. The change may break the v1 project format because weaft is pre-1.0 ([[RFC-0001:C-OPEN-QUESTIONS]]).

### Options Considered
Folder-per-kind with an optional override; a single all-in-one manifest; or a flat directory disambiguated only by frontmatter."""
decision = """
We will **organize source by kind in folders, allow an explicit per-artifact kind override, and keep singleton configuration in weaft.yaml**.

1. **Folder is the kind signal:** An artifact's containing folder determines its kind; a frontmatter override exists for the long tail. This satisfies [[RFC-0001:C-SOURCE-LAYOUT]].
2. **Singletons in the manifest:** Permissions/settings, MCP servers, ignore patterns, plugin identity, and the supported-hosts list live in weaft.yaml, because they are not naturally one file per artifact.
3. **Bodies preserved:** Prose-bearing kinds keep the frontmatter-plus-body Markdown file authors already use.

### Implementation Notes
Absent kind folders simply contribute no artifacts of that kind; no folder is mandatory beyond what a given project uses."""
consequences = """
### Positive
- Project structure is legible and mirrors host conventions.
- Authoring stays ergonomic for both prose kinds and config kinds.
- New kinds slot in as new folders without schema gymnastics.

### Negative
- v1 projects must migrate to the new layout (mitigation: weaft is pre-1.0; migration tooling versus documentation is deferred per [[RFC-0001:C-OPEN-QUESTIONS]]).

### Neutral
- The example project and quickstart must be rewritten to the v2 layout."""

[[content.alternatives]]
text = "Folder-per-kind, plus an optional per-artifact kind override, plus config singletons in weaft.yaml"
status = "accepted"
pros = [
  "Mirrors how each host lays out its own configuration; the mental model transfers",
  "Keeps the frontmatter-plus-body file for prose-bearing kinds",
  "Puts non-file-per-artifact configuration where configuration belongs",
]
cons = [ "More top-level folders in a project" ]

[[content.alternatives]]
text = "A single manifest describing every artifact inline"
status = "rejected"
cons = [ "Loses per-artifact file bodies; concentrates everything into one large file" ]
rejection_reason = "Poor authoring ergonomics for prose-bearing kinds like instructions and skills"

[[content.alternatives]]
text = "A flat directory where kind is set only by a frontmatter field"
status = "rejected"
cons = [ "Kind is hidden until a file is opened; no at-a-glance project structure" ]
rejection_reason = "Less legible and more error-prone than folder-by-kind"
